apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pi-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-runner.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pi-runner.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-runner.fullname" . }}
                  key: github-token
            - name: RUNNER_SCOPE
              value: {{ .Values.github.scope | quote }}
            {{- if eq .Values.github.scope "org" }}
            - name: ORG_NAME
              value: {{ .Values.github.target | quote }}
            {{- else }}
            - name: REPO_URL
              value: {{ .Values.github.target | quote }}
            {{- end }}
            - name: RUNNER_NAME_PREFIX
              value: {{ .Values.runner.name | quote }}
            - name: LABELS
              value: {{ .Values.runner.labels | quote }}
            - name: RUNNER_WORKDIR
              value: {{ .Values.runner.workdir | quote }}
            - name: EPHEMERAL
              value: {{ .Values.runner.ephemeral | quote }}
            # Route Docker CLI to the DinD sidecar daemon.
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: {{ .Values.runner.workdir }}

        # DinD sidecar — runs dockerd so Actions Docker build steps work.
        # TLS disabled (DOCKER_TLS_CERTDIR="") for simple pod-local connectivity.
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args: ["--mtu=1450"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: work
              mountPath: {{ .Values.runner.workdir }}
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: work
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
